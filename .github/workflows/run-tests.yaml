# This workflow will run all tests as well as pre-commit

name: Tests and linting
on:
  push:
    branches:
      - master
  pull_request:
  merge_group:
  schedule:
    - cron: "0 0 */2 * *"

# A force-push during review supersedes the previous run; without this it keeps
# running and holding runners.
#
# The group is per-ref for pull requests, so a new push replaces the run it
# supersedes, and per-run for everything else. A shared group would serialize
# even without cancellation: pushes to master and the nightly schedule both
# resolve to refs/heads/master, so they would queue behind one another. Merge
# queue entries must report on their temporary branch and master pushes are the
# record for the landed commit, so neither may be cancelled or delayed.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request'
    && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pre-commit run --all

  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: python demo.py --headless
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: ./scripts/ci.sh
        env:
          DISPLAY: ":99.0"
          GROUP: ${{ matrix.group }}
          SPLITS: 7
      - name: Test failure summary
        if: always()
        continue-on-error: true
        run: |
          python - <<'PYEOF'
          import xml.etree.ElementTree as ET, os, sys
          if not os.path.exists("junit-report.xml"):
              sys.exit(0)
          tree = ET.parse("junit-report.xml")
          root = tree.getroot()
          # Collect suite-level stats
          suites = list(root.iter("testsuite"))
          total = sum(int(s.get("tests", 0)) for s in suites)
          fails = sum(int(s.get("failures", 0)) for s in suites)
          errs = sum(int(s.get("errors", 0)) for s in suites)
          bad = fails + errs
          if bad == 0:
              sys.exit(0)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"### Group ${{ matrix.group }}: {bad}/{total} test(s) failed\n\n")
              for tc in root.iter("testcase"):
                  for tag in ("failure", "error"):
                      elem = tc.find(tag)
                      if elem is None:
                          continue
                      name = tc.get("name", "?")
                      cls = tc.get("classname", "")
                      short = cls.rsplit(".", 1)[-1] if cls else ""
                      etype = elem.get("type", tag)
                      msg = elem.get("message", "")
                      trace = (elem.text or "").rstrip()
                      # Summary line shows test + exception type
                      f.write(f"<details>\n<summary>")
                      f.write(f"<code>{short}::{name}</code> — {etype}")
                      if msg:
                          oneliner = msg.split("\n")[0][:120]
                          f.write(f": {oneliner}")
                      f.write(f"</summary>\n\n```\n{trace}\n```\n</details>\n\n")
          PYEOF
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.group }}
          path: coverage.xml

  upload-coverage:
    runs-on: ubuntu-latest
    needs: tests
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: .
          fail_ci_if_error: false

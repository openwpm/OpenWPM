<!doctype html>
<html>
  <head>
    <title>Test page for navigator.webdriver spoofing.</title>
    <script type="text/javascript">
      // Runs in the page world during parsing, i.e. as early as a bot check on
      // a real site would. The result is written into the DOM at load, because
      // Selenium's execute_script sees the page through Xray vision and would
      // read the unspoofed value and none of the page's expandos.
      var webdriverDescriptor = Object.getOwnPropertyDescriptor(
        Navigator.prototype,
        "webdriver"
      );
      // Bound before any hook is installed, so invoking the getter on another
      // receiver does not itself go through `Function.prototype.call`.
      var invokeWebdriverGetter = Function.prototype.call.bind(
        webdriverDescriptor.get
      );
      // A getter that reaches back into the page's builtins is observable,
      // and breakable, from them.
      function readWithHookedBuiltins(read) {
        var hits = 0;
        var call = Function.prototype.call;
        var apply = Function.prototype.apply;
        var reflectApply = Reflect.apply;
        function hook() {
          hits++;
          throw new Error("hooked builtin reached");
        }
        Function.prototype.call = hook;
        Function.prototype.apply = hook;
        Reflect.apply = hook;
        var result;
        try {
          result = "value:" + read();
        } catch (e) {
          result = "threw:" + e.name + ": " + e.message;
        }
        Function.prototype.call = call;
        Function.prototype.apply = apply;
        Reflect.apply = reflectApply;
        return result + ",hits:" + hits;
      }
      window.__openwpmWebdriverProbe = {
        value: navigator.webdriver,
        ownOnInstance: Object.prototype.hasOwnProperty.call(
          navigator,
          "webdriver"
        ),
        prototypeKeys: Object.getOwnPropertyNames(Navigator.prototype),
        getterName: webdriverDescriptor.get.name,
        getterSource: webdriverDescriptor.get.toString(),
        hasSetter: webdriverDescriptor.set !== undefined,
        // A replaced accessor tends to differ from native here: native
        // throws when called on a non-Navigator, and reports its own
        // property order.
        getterOnWrongReceiver: (function () {
          try {
            webdriverDescriptor.get.call({});
            return "returned";
          } catch (e) {
            return [
              e.name,
              e.message,
              e.fileName,
              e.lineNumber,
              e.columnNumber,
            ].join("|");
          }
        })(),
        getterConstructed: (function () {
          try {
            new webdriverDescriptor.get();
            return "constructed";
          } catch (e) {
            return e.name + ": " + e.message;
          }
        })(),
        ownReadWithHookedBuiltins: readWithHookedBuiltins(function () {
          return navigator.webdriver;
        }),
        wrongReceiverWithHookedBuiltins: readWithHookedBuiltins(function () {
          return invokeWebdriverGetter({});
        }),
        getterOwnKeys: Object.getOwnPropertyNames(
          webdriverDescriptor.get
        ).join(","),
        enumerable: webdriverDescriptor.enumerable,
        configurable: webdriverDescriptor.configurable,
      };
      // Writes go last: they must not stick, but if they did they would skew
      // every probe above.
      var probe = window.__openwpmWebdriverProbe;
      probe.sloppyAssign = (function () {
        navigator.webdriver = !navigator.webdriver;
        return navigator.webdriver;
      })();
      probe.strictAssign = (function () {
        "use strict";
        try {
          navigator.webdriver = !navigator.webdriver;
          return "no-throw";
        } catch (e) {
          return e.name + ": " + e.message;
        }
      })();
      probe.ownDescriptorAfterAssign = String(
        Object.getOwnPropertyDescriptor(navigator, "webdriver")
      );
      // fpscanner 1.0.8's `webdriverWritable` signal, verbatim but for names.
      probe.fpscannerWebdriverWritable = (function () {
        try {
          var nav = window.navigator;
          if (!nav.webdriver && !nav.hasOwnProperty("webdriver")) {
            nav.webdriver = 1;
            var stuck = nav.webdriver === 1;
            delete nav.webdriver;
            return stuck;
          }
          return true;
        } catch (e) {
          return false;
        }
      })();
    </script>
  </head>
  <body>
    <h3>Test page for navigator.webdriver spoofing.</h3>
    <iframe id="static-frame" src="simple_a.html"></iframe>
    <pre id="probe"></pre>
    <script type="text/javascript">
      window.addEventListener("load", function () {
        var probe = window.__openwpmWebdriverProbe;
        var frameNavigator =
          document.getElementById("static-frame").contentWindow.navigator;
        probe.staticFrameValue = frameNavigator.webdriver;
        probe.crossRealmWithHookedBuiltins = readWithHookedBuiltins(
          function () {
            return invokeWebdriverGetter(frameNavigator);
          }
        );
        document.getElementById("probe").textContent = JSON.stringify(probe);
        document.documentElement.setAttribute("data-probe-complete", "1");
      });
    </script>
  </body>
</html>

repos:
  - repo: https://github.com/timothycrosley/isort
    rev: 9.0.2
    hooks:
      - id: isort
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        language_version: python3
  - repo: local
    hooks:
      # Runs from the conda env so it sees the real installed packages.
      # --scripts-are-modules: otherwise shebang files are named __main__ and
      # miss the `test.*` overrides in pyproject.toml.
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types_or: [python, pyi]
        args: [--scripts-are-modules]
        require_serial: true
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.11
    hooks:
      - id: actionlint
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.11.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
  - repo: local
    hooks:
      - id: check-environment-pins
        name: Validate environment.yaml pins match unpinned sources
        entry: python scripts/manage-environment.py check
        language: python
        language_version: python3
        files: (^environment\.yaml$|^scripts/environment-unpinned|^scripts/manage-environment\.py$)
        additional_dependencies: [pyyaml]
        pass_filenames: false
